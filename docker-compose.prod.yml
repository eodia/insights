# Déploiement de production d'eodia insights.
#
#   cp .env.example .env    # ou exportez les variables ci-dessous
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Services : catalog (PostgreSQL de l'application), trino (moteur unique ; il demande chaque
# autorisation à l'API via l'endpoint OPA interne), api, worker, web, mcp, caddy (HTTPS).
# Une seule image (Dockerfile à la racine) sert api, worker, web et mcp.
#
# ── Variables (fichier .env à côté de ce fichier, ou environnement) ─────────────
# Obligatoires
#   DOMAIN               nom de domaine public (Caddy obtient le certificat) — ex. bi.exemple.fr
#   SECRET_KEY           64 caractères hexadécimaux : chiffre les secrets des sources (openssl rand -hex 32)
#   OPA_SECRET           secret du chemin de l'endpoint OPA appelé par Trino (openssl rand -hex 24)
#   DB_PASSWORD          mot de passe du PostgreSQL du catalogue
# Facultatives (valeurs par défaut entre parenthèses)
#   PUBLIC_URL           adresse publique (https://$DOMAIN) ; https:// rend le cookie Secure
#   ACME_EMAIL           contact Let's Encrypt
#   DATABASE_SCHEMA      schéma du catalogue (eodia)
#   TRINO_SERVICE_USER   utilisateur Trino du service (eodia-service)
#   TRINO_PASSWORD       mot de passe Trino, si Trino exige une authentification
#   SESSION_DAYS         durée d'une session (14)
#   MAX_ROWS             lignes lues au plus par requête de l'interface (2000)
#   QUERY_TIMEOUT_MS     délai maximal d'une requête (120000)
#   CACHE_TTL            durée du cache de résultats en secondes (300)
#   PASSWORD_LOGIN       connexion par mot de passe, 0 pour la couper (1)
#   OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_LABEL,
#   OIDC_SCOPES, OIDC_ATTRIBUTE_CLAIMS, OIDC_GROUPS_CLAIM
#                        SSO OpenID Connect (Keycloak, Entra ID…)
#   SMTP_URL, SMTP_FROM
#                        envoi des invitations par e-mail
#   AI_PROVIDER          anthropic | openai | mistral | openai-compatible | none
#   AI_API_KEY (ou ANTHROPIC_API_KEY / OPENAI_API_KEY), AI_MODEL, AI_BASE_URL,
#   AI_HOURLY_QUOTA (60) copilot
#   DEMO                 1 : crée l'instance de démonstration (0)
#   IMAGE                image à utiliser (eodia-insights:latest)

name: eodia-insights-prod

x-app: &app
  image: ${IMAGE:-eodia-insights:latest}
  build:
    context: .
    args:
      # Next fige ses rewrites au build ; derrière Caddy, /api/* ne passe de toute façon pas par lui.
      API_URL: http://api:4100
      # Les pages pré-rendues doivent annoncer l'adresse publique de leur image de partage.
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?DOMAIN manquant}}
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://eodia:${DB_PASSWORD:?DB_PASSWORD manquant}@catalog:5432/eodia
    DATABASE_SCHEMA: ${DATABASE_SCHEMA:-eodia}
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant (openssl rand -hex 32)}
    OPA_SECRET: ${OPA_SECRET:?OPA_SECRET manquant}
    TRINO_URL: http://trino:8080
    TRINO_SERVICE_USER: ${TRINO_SERVICE_USER:-eodia-service}
    TRINO_PASSWORD: ${TRINO_PASSWORD:-}
    PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?DOMAIN manquant}}
    SESSION_DAYS: ${SESSION_DAYS:-14}
    MAX_ROWS: ${MAX_ROWS:-2000}
    QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-120000}
    CACHE_TTL: ${CACHE_TTL:-300}
    PASSWORD_LOGIN: ${PASSWORD_LOGIN:-1}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_LABEL: ${OIDC_LABEL:-}
    OIDC_SCOPES: ${OIDC_SCOPES:-}
    OIDC_ATTRIBUTE_CLAIMS: ${OIDC_ATTRIBUTE_CLAIMS:-}
    OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
    SMTP_URL: ${SMTP_URL:-}
    SMTP_FROM: ${SMTP_FROM:-}
    AI_PROVIDER: ${AI_PROVIDER:-}
    AI_API_KEY: ${AI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_HOURLY_QUOTA: ${AI_HOURLY_QUOTA:-60}
    DEMO: ${DEMO:-0}
    # Les jobs tournent dans le service worker, pas dans l'API.
    INPROCESS_WORKER: '0'

services:
  catalog:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eodia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
      POSTGRES_DB: eodia
    volumes: [catalog-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eodia']
      interval: 5s
      retries: 20

  trino:
    image: trinodb/trino:483
    restart: unless-stopped
    environment:
      CATALOG_MANAGEMENT: dynamic
      # Trino demande chaque autorisation à l'API : allow, batch, row-filters, column-masks.
      OPA_URL: http://api:4100/internal/opa/${OPA_SECRET:?OPA_SECRET manquant}
    volumes:
      - ./docker/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8080/v1/info']
      interval: 5s
      retries: 60

  api:
    <<: *app
    command: ['api']
    depends_on:
      catalog: { condition: service_healthy }
      # Pas d'attente de Trino : l'API doit écouter avant que Trino ne l'interroge.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 6

  worker:
    <<: *app
    command: ['worker']
    depends_on:
      api: { condition: service_healthy }
      trino: { condition: service_healthy }

  web:
    <<: *app
    command: ['web']
    environment:
      <<: *app-env
      API_URL: http://api:4100
    depends_on:
      api: { condition: service_healthy }

  mcp:
    <<: *app
    command: ['mcp']
    environment:
      NODE_ENV: production
      # Le serveur MCP ne détient aucun secret : il relaie le jeton de chaque appel à l'API.
      API_URL: http://api:4100
      MCP_PORT: '4200'
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
      # Caddy refuse une directive « email » vide : à défaut, admin@ le domaine.
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api, mcp]

volumes:
  catalog-data:
  caddy-data:
  caddy-config:
